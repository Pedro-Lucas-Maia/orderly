#Configurações do flyway
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true
spring.docker.compose.lifecycle-management=start_only
spring.docker.compose.start.arguments=--wait

#Configurações dos tokens JWT
jwt.public.key = classpath:env/app.pub
jwt.secret = classpath:env/app.key
app.security.jwt.expiration-seconds=${JWT_EXPIRATION:300}

#Configuração do serviço de e-mail
resend.api.key = ${RESEND_API_KEY:default_api_key}

#Habilita threads virtuais para processos assíncronos
spring.threads.virtual.enabled=true

#Configura acesso ao Banco de dados relacional
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

#Configura limite de upload de arquivos
spring.servlet.multipart.max-file-size=4MB

#Configuração das credenciais do Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#Validade padrão de lotes criados automaticamente (dias)
app.stock.adjustment-lot-days=365
app.stock.reversal-lot-days=7
app.stock.initial-lot-days=90

#Insights (previsão weekday average)
app.insights.forecast-weeks=8
app.insights.min-samples-high=6
app.insights.min-samples-medium=3
app.insights.expiry-window-days=3
app.insights.horizon-days=1
app.insights.timezone=America/Sao_Paulo

# 1. Envia 100% dos traces (Em produção real usa-se 0.1 ou 10%, mas em dev usamos 1.0 para ver tudo)
management.tracing.sampling.probability=1.0

# 2. Endpoints OTLP apontando para o container otel-lgtm na porta 4318
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs

# 3. Habilita suporte à anotação @Observed nos seus Services
management.observations.annotations.enabled=true

# 4. Inclui o traceId e spanId no padrão de log do console (caso o Boot 4 não exiba por padrão no seu layout)
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
