services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    labels:
      org.springframework.boot.ignore: "true"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U myuser -d mydatabase" ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
    labels:
      org.springframework.boot.ignore: "true"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-lgtm:
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'   # Interface Web do Grafana (http://localhost:3000)
      - '4317:4317'   # Receptor OTLP via gRPC
      - '4318:4318'   # Receptor OTLP via HTTP (usado pelo Spring Boot)
    environment:
      - GF_PATHS_DATA=/data/grafana
    volumes:
      - lgtm_data:/data

volumes:
  lgtm_data: